name: Publicar no GitHub Pages

# Faz lint, testes e build a cada push na main e publica a pasta dist/
# no branch gh-pages, que o GitHub Pages serve em
# https://duduwwl.github.io/Terra-Do-Sol/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publica dist/ no branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
